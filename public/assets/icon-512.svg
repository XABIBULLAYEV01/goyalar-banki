<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg512" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080d19" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#172540" />
    </linearGradient>
    <linearGradient id="gold512" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5cf7b" />
      <stop offset="50%" stop-color="#d4a74b" />
      <stop offset="100%" stop-color="#9e7328" />
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="110" fill="url(#bg512)" stroke="url(#gold512)" stroke-width="8" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#gold512)" stroke-width="3" stroke-dasharray="14,10" opacity="0.6" />

  <!-- Lid -->
  <path d="M 175 170 L 337 170 L 326 200 L 186 200 Z" fill="url(#gold512)" />
  <rect x="195" y="146" width="122" height="24" rx="8" fill="#f5cf7b" />
  
  <!-- Jar body -->
  <path d="M 186 200 C 154 206 138 238 138 288 C 138 358 165 385 256 385 C 347 385 374 358 374 288 C 374 238 358 206 326 200 Z" 
        fill="rgba(232, 189, 104, 0.16)" stroke="url(#gold512)" stroke-width="8" filter="url(#glow512)" />

  <text x="256" y="310" font-size="75" font-family="Arial, sans-serif" font-weight="900" fill="#f5cf7b" text-anchor="middle">✦</text>

  <!-- Crown for Admin -->
  <path d="M 220 120 L 256 94 L 292 120 L 280 136 L 232 136 Z" fill="url(#gold512)" />
  <circle cx="256" cy="90" r="7" fill="#ffffff" />
  <circle cx="220" cy="116" r="5" fill="#ffffff" />
  <circle cx="292" cy="116" r="5" fill="#ffffff" />
</svg>
