<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080d19" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#172540" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5cf7b" />
      <stop offset="50%" stop-color="#d4a74b" />
      <stop offset="100%" stop-color="#9e7328" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded app icon -->
  <rect width="192" height="192" rx="42" fill="url(#bg)" stroke="url(#gold)" stroke-width="3" />

  <!-- Outer glow ring -->
  <circle cx="96" cy="96" r="64" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6" />

  <!-- 3D Jar icon silhouette -->
  <path d="M 66 65 L 126 65 L 122 76 L 70 76 Z" fill="url(#gold)" />
  <rect x="74" y="56" width="44" height="9" rx="3" fill="#f5cf7b" />
  
  <!-- Jar body -->
  <path d="M 70 76 C 58 78 52 90 52 108 C 52 134 62 144 96 144 C 130 144 140 134 140 108 C 140 90 134 78 122 76 Z" 
        fill="rgba(232, 189, 104, 0.15)" stroke="url(#gold)" stroke-width="3" filter="url(#glow)" />

  <!-- Center Star ✦ -->
  <text x="96" y="116" font-size="28" font-family="Arial, sans-serif" font-weight="900" fill="#f5cf7b" text-anchor="middle">✦</text>

  <!-- Crown for Admin -->
  <path d="M 82 46 L 96 36 L 110 46 L 105 52 L 87 52 Z" fill="url(#gold)" />
  <circle cx="96" cy="34" r="2.5" fill="#ffffff" />
  <circle cx="82" cy="44" r="2" fill="#ffffff" />
  <circle cx="110" cy="44" r="2" fill="#ffffff" />
</svg>
